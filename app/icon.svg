<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Red background -->
  <rect width="32" height="32" rx="4" fill="#E8192C"/>

  <!-- Speed lines (left, matching logo motion lines) -->
  <line x1="2"  y1="11"   x2="7.5" y2="11"   stroke="white" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="3"  y1="14.5" x2="8.5" y2="14.5" stroke="white" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="4"  y1="18"   x2="9"   y2="18"   stroke="white" stroke-width="1.3" stroke-linecap="round"/>

  <!-- Handle: curves up from speed-line level to cart top-left -->
  <path d="M9 14.5 Q10 7 13.5 8" fill="none" stroke="white" stroke-width="1.7" stroke-linecap="round"/>

  <!-- Cart body (trapezoid, wider at top like the logo) -->
  <path d="M13 8 L27.5 8 L25.5 21 L14 21 Z"
        fill="none" stroke="white" stroke-width="1.7" stroke-linejoin="round"/>

  <!-- Inner grid: 1 vertical + 1 horizontal divider -->
  <line x1="20"   y1="8"  x2="19.3" y2="21"  stroke="white" stroke-width="1"   stroke-opacity="0.55"/>
  <line x1="13"   y1="14.5" x2="27.5" y2="14.5" stroke="white" stroke-width="1" stroke-opacity="0.55"/>

  <!-- Wheels (outlined circles like logo) -->
  <circle cx="16.5" cy="25.5" r="2.2" fill="none" stroke="white" stroke-width="1.7"/>
  <circle cx="23.5" cy="25.5" r="2.2" fill="none" stroke="white" stroke-width="1.7"/>
</svg>
