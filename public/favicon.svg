<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Speed lines -->
  <line x1="1" y1="11" x2="7"  y2="11" stroke="#E8192C" stroke-width="2"   stroke-linecap="round"/>
  <line x1="2" y1="15" x2="8"  y2="15" stroke="#E8192C" stroke-width="2"   stroke-linecap="round"/>
  <line x1="3" y1="19" x2="9"  y2="19" stroke="#E8192C" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Handle -->
  <path d="M8 7 Q10 7 10 9" fill="none" stroke="#E8192C" stroke-width="2" stroke-linecap="round"/>
  <!-- Cart body -->
  <rect x="10" y="9" width="18" height="13" rx="2" fill="#E8192C"/>
  <!-- Internal grid -->
  <line x1="19" y1="9"  x2="19" y2="22" stroke="white" stroke-width="1.2" stroke-opacity="0.5"/>
  <line x1="10" y1="15" x2="28" y2="15" stroke="white" stroke-width="1.2" stroke-opacity="0.5"/>
  <!-- Wheels -->
